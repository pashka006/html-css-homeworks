<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What do I have in my fridge?</title>
   <style>
       /* Базове скидання відступів браузера */
       * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
       }

       body {
           font-family: Arial, Helvetica, sans-serif;
           background-color: #f4f6f8; /* Легкий сірий фон всієї сторінки */
           display: flex;
           justify-content: center; /* Центруємо весь білий блок по центру екрана */
           padding: 50px;
       }

       /* Білий блок-холодильник */
       .fridge-container {
           background-color: white;
           padding: 40px;
           border-radius: 10px;
           text-align: center;
           max-width: 700px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* Легка тінь для краси */
       }

       h2 {
           margin-bottom: 30px;
       }

       /* --- МАГІЯ FLEXBOX (ГЕНЕРАЛ) --- */
       .products-grid {
           display: flex;
           flex-wrap: wrap; /* Наказуємо переносити картки на новий рядок, якщо не влазять */
           justify-content: center; /* Центруємо картки по горизонталі */
           gap: 15px; /* Ідеальні проміжки між усіма картками (замінює костилі з margin) */
           margin-bottom: 30px;
       }

       /* --- КАРОЧКИ (СОЛДАТИ) --- */
       .product-card {
           width: 110px; /* Задаємо фіксовану ширину, щоб всі були однакові */
           padding: 20px 10px;
           border: 2px solid #eaeaea; /* Сіра рамочка */
           border-radius: 15px; /* Закруглені кути */
           background-color: white;
       }

       /* Замінюємо картинки на гігантський текст (емодзі) */
       .icon {
           font-size: 50px;
           margin-bottom: 10px;
       }

       .product-card p {
           font-size: 14px;
           font-weight: bold;
           color: #333;
       }

       .footer-text {
           font-size: 12px;
           color: #888;
           font-weight: bold;
       }
   </style>
</head>
<body>

<div class="fridge-container">
    <h2>What do I have in my fridge?</h2>

    <div class="products-grid">

        <div class="product-card">
            <div class="icon">🍏</div>
            <p>Pepper</p>
        </div>

        <div class="product-card">
            <div class="icon">🍎</div>
            <p>Apple</p>
        </div>

        <div class="product-card">
            <div class="icon">🧀</div>
            <p>Cheese</p>
        </div>

    </div>

    <p class="footer-text">... that's all ...</p>
</div>

</body>
</html>
