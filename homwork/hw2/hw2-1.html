<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What do I have in my fridge?</title>

       }

       }

    .products-grid{
        display: flex;

        display: flex;
        align-items: center;
        flex-direction: column;



    }
    .icon{
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-size: 80px;


    }
    .footer-text{
        text-align: center;

    }
   </style>
</head>

</div>

</html>
